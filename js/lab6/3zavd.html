<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Автономери</title>
</head>
<body>
    <h2>Пошук області за номером автомобіля</h2>
    <form onsubmit="return findRegion()">
        <label>Введіть номер автомобіля латинською розкладкою (наприклад АО1234КО):</label><br>
        <input type="text" id="car_number" required><br><br>
        <button type="submit">Визначити область</button>
    </form>

    <script>
    function findRegion() {
        const num = document.getElementById('car_number').value.toUpperCase();
        
        if (num.length < 2) {
            alert('Номер занадто короткий.');
            return false;
        }

        const code = num.substring(0, 2);

        const codes = [
            'AC', 'KC', 'BC', 'HC', 'AO', 'KO', 'AT', 'KT', 
            'BO', 'HO', 'BX', 'HX', 'CE', 'IE', 'AB', 'KB', 
            'AI', 'KI', 'AA', 'KA', 'CB', 'IB', 'CA', 'IA', 
            'BI', 'HI', 'AX', 'KX', 'BB', 'HB', 'BM', 'HM', 
            'BA', 'HA', 'AE', 'KE', 'AH', 'KH', 'AP', 'KP', 
            'BT', 'HT', 'BH', 'BE', 'HE', 'HH', 'AK', 'KK', 
            'CH', 'IH'
        ];

        const regions = [
            'Волинська область', 'Волинська область', 'Львівська область', 'Львівська область', 
            'Закарпатська область', 'Закарпатська область', 'Івано-Франківська область', 'Івано-Франківська область',
            'Тернопільська область', 'Тернопільська область', 'Хмельницька область', 'Хмельницька область', 
            'Чернівецька область', 'Чернівецька область', 'Вінницька область', 'Вінницька область',
            'Київська область', 'Київська область', 'м. Київ', 'м. Київ', 
            'Чернігівська область', 'Чернігівська область', 'Черкаська область', 'Черкаська область',
            'Полтавська область', 'Полтавська область', 'Харківська область', 'Харківська область', 
            'Луганська область', 'Луганська область', 'Сумська область', 'Сумська область',
            'Кіровоградська область', 'Кіровоградська область', 'Дніпропетровська область', 'Дніпропетровська область', 
            'Донецька область', 'Донецька область', 'Запорізька область', 'Запорізька область',
            'Херсонська область', 'Херсонська область', 'Одеська область', 'Одеська область', 
            'Одеська область', 'Одеська область', 'АР Крим', 'АР Крим', 
            'м. Севастополь', 'м. Севастополь'
        ];

        const index = codes.indexOf(code);

        if (index !== -1) {
            alert('Область реєстрації: ' + regions[index]);
        } else {
            alert('Невідомий код області. Перевірте, чи введено літери латиницею.');
        }

        return false;
    }
    </script>
</body>
</html>
