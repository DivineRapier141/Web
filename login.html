<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Вхід - Світова архітектура</title>
</head>
<body>
    <header>
        <h1>Світова архітектура</h1>
        <h3>Довідник найвідоміших споруд людства</h3>
    </header>

    <nav>
        <input type="checkbox" id="menu-toggle" class="menu-checkbox">
        <label for="menu-toggle" class="mobile-menu-btn">Меню</label>
        <div class="nav-links">
            <a href="index.html">Головна</a>
            <a href="login.html">Вхід</a>
            <a href="register.html">Реєстрація</a>
            <a href="feedback.html">Зворотній зв’язок</a>
        </div>
    </nav>

    <main>
        <h2>Вхід до системи</h2>
        <form action="#" method="post" onsubmit="return validateLogin()">
            <p>
                <label for="login">Логін:</label><br>
                <input type="text" id="login" name="login" required>
            </p>
            <p>
                <label for="password">Пароль:</label><br>
                <input type="password" id="password" name="password" required>
            </p>
            <p>
                <input type="checkbox" id="remember" name="remember">
                <label for="remember">Залишатися в системі</label>
            </p>
            <button type="submit">Увійти</button>
        </form>
    </main>

    <footer>
        <p>2026 Лабораторна 1</p>
    </footer>

    <script>
    function validateLogin() {
        const loginInput = document.getElementById('login').value;
        const passwordInput = document.getElementById('password').value;

        const allowedLogins = ['admin', 'student2026', 'andriy'];
        const allowedPasswords = ['password123', 'qwerty', '123456'];

        let isLoginFound = false;
        let isPasswordCorrect = false;

        for (let i = 0; i < allowedLogins.length; i++) {
            if (allowedLogins[i] === loginInput) {
                isLoginFound = true;
                if (allowedPasswords[i] === passwordInput) {
                    isPasswordCorrect = true;
                }
                break;
            }
        }

        if (isLoginFound === false) {
            alert('Помилка: незареєстрований логін.');
            return false;
        } else if (isPasswordCorrect === false) {
            alert('Помилка: логін та пароль не співпадають.');
            return false;
        } else {
            alert('Вхід виконано успішно!');
            return true;
        }
    }
    </script>
</body>
</html>
